<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ASL Interpreter system flow</title>
  <desc id="desc">Webcam frames pass through MediaPipe Hands, heuristic classifier, stability filter, sentence builder, and transcript output.</desc>
  <rect width="1200" height="360" fill="#05070d"/>
  <g font-family="Segoe UI, Arial">
    <text x="60" y="58" fill="#f8fafc" font-size="34" font-weight="800">Client-side ASL interpretation pipeline</text>
    <text x="60" y="92" fill="#94a3b8" font-size="18">No backend required by default. Camera frames stay in the browser unless optional local AI mode is enabled.</text>
    <g transform="translate(58 142)">
      <g>
        <rect width="170" height="96" rx="16" fill="#0f172a" stroke="#334155"/>
        <text x="24" y="42" fill="#e2e8f0" font-size="20" font-weight="700">Webcam</text>
        <text x="24" y="68" fill="#94a3b8" font-size="15">live frames</text>
      </g>
      <g transform="translate(210 0)">
        <rect width="170" height="96" rx="16" fill="#0f172a" stroke="#334155"/>
        <text x="24" y="42" fill="#e2e8f0" font-size="20" font-weight="700">MediaPipe</text>
        <text x="24" y="68" fill="#94a3b8" font-size="15">21 hand points</text>
      </g>
      <g transform="translate(420 0)">
        <rect width="170" height="96" rx="16" fill="#0f172a" stroke="#334155"/>
        <text x="24" y="42" fill="#e2e8f0" font-size="20" font-weight="700">Classifier</text>
        <text x="24" y="68" fill="#94a3b8" font-size="15">geometry rules</text>
      </g>
      <g transform="translate(630 0)">
        <rect width="170" height="96" rx="16" fill="#0f172a" stroke="#334155"/>
        <text x="24" y="42" fill="#e2e8f0" font-size="20" font-weight="700">Vote filter</text>
        <text x="24" y="68" fill="#94a3b8" font-size="15">hold to confirm</text>
      </g>
      <g transform="translate(840 0)">
        <rect width="170" height="96" rx="16" fill="#0f172a" stroke="#334155"/>
        <text x="24" y="42" fill="#e2e8f0" font-size="20" font-weight="700">Sentence</text>
        <text x="24" y="68" fill="#94a3b8" font-size="15">patterns + grammar</text>
      </g>
      <g transform="translate(1050 0)">
        <rect width="92" height="96" rx="16" fill="#082f49" stroke="#38bdf8"/>
        <text x="20" y="42" fill="#e0f2fe" font-size="20" font-weight="700">Text</text>
        <text x="20" y="68" fill="#bae6fd" font-size="15">copy</text>
      </g>
      <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round">
        <path d="M178 48 H202"/><path d="M388 48 H412"/><path d="M598 48 H622"/><path d="M808 48 H832"/><path d="M1018 48 H1042"/>
      </g>
    </g>
  </g>
</svg>
